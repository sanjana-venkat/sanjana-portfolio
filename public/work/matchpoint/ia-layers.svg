<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <style>
      .lab{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase}
      .hd{font-size:17px;font-weight:800;letter-spacing:-.2px}
      .sub{font-size:12.5px;font-weight:500}
      .tab{font-size:13px;font-weight:600}
      .ink{fill:#16150F}.mut{fill:#16150F;opacity:.52}
    </style>
  </defs>

  <!-- global layer -->
  <rect x="20" y="20" width="880" height="128" rx="22" fill="#16150F"/>
  <text x="52" y="56" class="lab" fill="#F4C22C">Belongs to MatchPoint</text>
  <text x="52" y="84" class="hd" fill="#fff">Chats · Notifications · The sport switcher</text>
  <text x="52" y="112" class="sub" fill="#ffffff" opacity=".62">Reached from the app bar. Slides over everything. A message is from a person,</text>
  <text x="52" y="130" class="sub" fill="#ffffff" opacity=".62">not from a badminton person, so switching sport does not touch any of it.</text>

  <!-- the line -->
  <line x1="20" y1="184" x2="900" y2="184" stroke="#16150F" stroke-width="2" stroke-dasharray="5 5" stroke-opacity=".45"/>
  <rect x="352" y="170" width="216" height="28" rx="14" fill="#F4C22C"/>
  <text x="460" y="189" text-anchor="middle" class="lab ink">The boundary</text>

  <!-- sport-scoped -->
  <rect x="20" y="222" width="880" height="228" rx="22" fill="#fff" stroke="#16150F" stroke-opacity=".14"/>
  <text x="52" y="258" class="lab" fill="#3F5240">Belongs to one sport</text>
  <text x="52" y="286" class="hd ink">Everything below the line swaps when you change sport</text>

  <g>
    <rect x="52" y="312" width="196" height="66" rx="16" fill="#F5F1EA"/>
    <text x="150" y="340" text-anchor="middle" class="tab ink">Map</text>
    <text x="150" y="362" text-anchor="middle" class="sub mut">players nearby</text>

    <rect x="264" y="312" width="196" height="66" rx="16" fill="#F5F1EA" stroke="#16150F" stroke-opacity=".22"/>
    <text x="362" y="340" text-anchor="middle" class="tab ink">Matches / Calendar</text>
    <text x="362" y="362" text-anchor="middle" class="sub mut">renames per category</text>

    <rect x="476" y="312" width="196" height="66" rx="16" fill="#F5F1EA"/>
    <text x="574" y="340" text-anchor="middle" class="tab ink">Home</text>
    <text x="574" y="362" text-anchor="middle" class="sub mut">rating, courts, people</text>

    <rect x="688" y="312" width="184" height="66" rx="16" fill="#F5F1EA"/>
    <text x="780" y="340" text-anchor="middle" class="tab ink">Profile</text>
    <text x="780" y="362" text-anchor="middle" class="sub mut">this sport's record</text>
  </g>

  <text x="52" y="412" class="sub mut">Four tabs, one shell, every sport. The create button changes with them:</text>
  <text x="52" y="432" class="sub mut">challenge and scores for pickleball, add a game and submit a review for cricket.</text>
</svg>
