<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 348" width="920" height="348" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <style>
      .lab{font-size:10.5px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase}
      .hd{font-size:15px;font-weight:800;letter-spacing:-.2px}
      .sub{font-size:12px;font-weight:500}
      .ink{fill:#16150F}.mut{fill:#16150F;opacity:.52}
    </style>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#16150F" fill-opacity=".38"/>
    </marker>
  </defs>

  <rect x="20" y="132" width="176" height="76" rx="18" fill="#16150F"/>
  <text x="108" y="164" text-anchor="middle" class="lab" fill="#F4C22C">Match ends</text>
  <text x="108" y="188" text-anchor="middle" class="hd" fill="#fff">Someone reports</text>

  <line x1="196" y1="170" x2="248" y2="170" stroke="#16150F" stroke-opacity=".38" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="256" y="132" width="176" height="76" rx="18" fill="#fff" stroke="#16150F" stroke-opacity=".16"/>
  <text x="344" y="164" text-anchor="middle" class="lab mut">Both reported?</text>
  <text x="344" y="188" text-anchor="middle" class="hd ink">Do they agree?</text>

  <!-- awaiting -->
  <path d="M344 132 L344 96 Q344 84 356 84 L468 84" fill="none" stroke="#16150F" stroke-opacity=".38" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="480" y="56" width="200" height="56" rx="16" fill="#F5F1EA" stroke="#16150F" stroke-opacity=".12"/>
  <text x="500" y="80" class="lab mut">Only one</text>
  <text x="500" y="99" class="sub ink" font-weight="700">Awaiting result</text>

  <!-- disputed -->
  <path d="M344 208 L344 244 Q344 256 356 256 L468 256" fill="none" stroke="#16150F" stroke-opacity=".38" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="480" y="228" width="200" height="56" rx="16" fill="#F5F1EA" stroke="#16150F" stroke-opacity=".12"/>
  <text x="500" y="252" class="lab mut">They disagree</text>
  <text x="500" y="271" class="sub ink" font-weight="700">Disputed. Nothing moves.</text>

  <!-- agree -->
  <line x1="432" y1="170" x2="484" y2="170" stroke="#16150F" stroke-opacity=".38" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="492" y="142" width="176" height="56" rx="16" fill="#F4C22C"/>
  <text x="580" y="177" text-anchor="middle" class="hd ink">They agree</text>

  <line x1="668" y1="170" x2="716" y2="170" stroke="#16150F" stroke-opacity=".38" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="724" y="88" width="176" height="66" rx="16" fill="#fff" stroke="#16150F" stroke-opacity=".16"/>
  <text x="748" y="114" class="lab" fill="#3F5240">Individual sport</text>
  <text x="748" y="136" class="sub ink" font-weight="700">Both ratings move</text>

  <rect x="724" y="186" width="176" height="66" rx="16" fill="#fff" stroke="#16150F" stroke-opacity=".16"/>
  <text x="748" y="212" class="lab mut">Group, or unrated</text>
  <text x="748" y="234" class="sub ink" font-weight="700">Recorded, not rated</text>

  <path d="M716 170 L716 121 L724 121" fill="none" stroke="#16150F" stroke-opacity=".38" stroke-width="1.5"/>
  <path d="M716 170 L716 219 L724 219" fill="none" stroke="#16150F" stroke-opacity=".38" stroke-width="1.5"/>

  <text x="20" y="320" class="sub mut">Enforced in Postgres, not just the interface: cricket, soccer and volleyball return “completed, no competitive rating”.</text>
</svg>
