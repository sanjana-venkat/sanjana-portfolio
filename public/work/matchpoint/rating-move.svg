<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <style>
      .lab{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase}
      .hd{font-size:17px;font-weight:800;letter-spacing:-.2px}
      .sub{font-size:12.5px;font-weight:500}
      .mono{font-size:19px;font-weight:700;letter-spacing:-.2px}
      .ink{fill:#16150F}.mut{fill:#16150F;opacity:.52}
    </style>
  </defs>

  <!-- formula -->
  <rect x="20" y="20" width="880" height="86" rx="20" fill="#16150F"/>
  <text x="52" y="52" class="lab" fill="#F4C22C">How far you move</text>
  <text x="52" y="84" class="mono" fill="#fff">change  =  K  ×  ( what happened  −  what was expected )</text>

  <!-- expected -->
  <rect x="20" y="128" width="428" height="252" rx="22" fill="#fff" stroke="#16150F" stroke-opacity=".14"/>
  <text x="48" y="164" class="lab" fill="#3F5240">Expected</text>
  <text x="48" y="190" class="hd ink">Comes from the gap</text>
  <text x="48" y="214" class="sub mut">A logistic curve over the rating difference.</text>

  <g stroke="#16150F" stroke-opacity=".16">
    <line x1="48" y1="340" x2="420" y2="340"/>
    <line x1="48" y1="240" x2="420" y2="240"/>
  </g>
  <path d="M48 336 C 140 334, 190 320, 234 290 C 278 260, 328 246, 420 244" fill="none" stroke="#F4C22C" stroke-width="3"/>
  <circle cx="234" cy="290" r="5" fill="#16150F"/>
  <text x="234" y="278" text-anchor="middle" class="sub ink" font-weight="700">even</text>
  <text x="48" y="360" class="sub mut">much weaker</text>
  <text x="420" y="360" text-anchor="end" class="sub mut">much stronger</text>

  <!-- K -->
  <rect x="472" y="128" width="428" height="252" rx="22" fill="#fff" stroke="#16150F" stroke-opacity=".14"/>
  <text x="500" y="164" class="lab" fill="#3F5240">K</text>
  <text x="500" y="190" class="hd ink">Comes from how sure we are</text>
  <text x="500" y="214" class="sub mut">Uncertainty starts at 12 and decays 4% a match, floor 3.</text>

  <g>
    <rect x="500" y="242" width="46" height="88" rx="8" fill="#F4C22C"/>
    <rect x="558" y="266" width="46" height="64" rx="8" fill="#F4C22C" opacity=".8"/>
    <rect x="616" y="288" width="46" height="42" rx="8" fill="#F4C22C" opacity=".6"/>
    <rect x="674" y="302" width="46" height="28" rx="8" fill="#F4C22C" opacity=".45"/>
    <rect x="732" y="312" width="46" height="18" rx="8" fill="#3F5240" opacity=".5"/>
    <rect x="790" y="316" width="46" height="14" rx="8" fill="#3F5240" opacity=".5"/>
    <line x1="500" y1="330" x2="872" y2="330" stroke="#16150F" stroke-opacity=".16"/>
  </g>
  <text x="523" y="236" text-anchor="middle" class="sub ink" font-weight="700">12</text>
  <text x="813" y="236" text-anchor="middle" class="sub ink" font-weight="700">2</text>
  <text x="500" y="352" class="sub mut">first match</text>
  <text x="872" y="352" text-anchor="end" class="sub mut">settled player</text>
</svg>
